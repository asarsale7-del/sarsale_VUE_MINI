services:
  - type: web
    name: campuscare-complaint-system
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: schooladmin
      - key: ADMIN_NAME
        value: School Complaint Monitor
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: complaint-evidence
      - key: APP_ORIGIN
        value: https://student-complaint-management-system-eight.vercel.app
